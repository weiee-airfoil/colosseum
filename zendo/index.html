<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zendō — RL environments, evals, and data for frontier AI labs</title>
<meta name="description" content="Zendō builds RL environments, evals, and data for frontier AI labs.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Substitutes for the Figma fonts (DGM Sprinter / Test Söhne / GT Flexa Mono are commercial):
     Hanken Grotesk covers headline + body, IBM Plex Mono covers the tracked nav caps. -->
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-primary:#fffcf3;        /* bg/primary */
    --el-highem:#191b19;         /* elements/highem */
    --el-midem:#606c66;          /* elements/midem */
    --el-secondary:#61a074;      /* elements/secondary */
    --sans:"Hanken Grotesk",-apple-system,"Segoe UI",sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{
    background:var(--bg-primary);
    color:var(--el-highem);
    font-family:var(--sans);
    display:flex;flex-direction:column;
    -webkit-font-smoothing:antialiased;
  }

  /* ── Navbar ─────────────────────────────────────────── */
  .navbar{
    height:64px;flex:none;
    display:flex;align-items:center;justify-content:space-between;
    padding:0 24px;position:relative;
  }
  .logo{display:flex;align-items:center;gap:7px;text-decoration:none;color:var(--el-highem)}
  .logo svg{display:block}
  .logo b{font-weight:500;font-size:19px;letter-spacing:.01em}
  .nav-links{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    display:flex;gap:32px;
  }
  .nav-links a,.nav-clients{
    font-family:var(--mono);font-size:12px;line-height:20px;
    letter-spacing:.48px;text-transform:uppercase;
    color:var(--el-midem);text-decoration:none;white-space:nowrap;
  }
  .nav-links a:hover,.nav-clients:hover{color:var(--el-highem)}

  /* ── Hero ───────────────────────────────────────────── */
  .hero{
    flex:1;display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    gap:48px;padding:32px 24px 80px;
  }
  .hero-art{
    width:704px;max-width:100%;
    cursor:pointer;position:relative;
  }
  .hero-art svg{display:block;width:100%;height:auto}

  .hero-copy{display:flex;flex-direction:column;align-items:center;gap:40px;text-align:center}
  .hero-copy h1{
    font-weight:300;font-size:40px;line-height:48px;letter-spacing:.4px;
    color:var(--el-highem);
  }
  .hero-copy .subtext{
    max-width:544px;margin-top:16px;
    font-size:16px;line-height:24px;color:var(--el-midem);
  }
  .cta{
    display:inline-flex;align-items:center;justify-content:center;
    height:44px;padding:0 24px;border:0;border-radius:99px;
    background:var(--el-secondary);color:var(--bg-primary);
    font-family:var(--sans);font-size:16px;font-weight:400;
    cursor:pointer;position:relative;overflow:hidden;
    transition:transform .25s ease,box-shadow .25s ease;
  }
  .cta:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(97,160,116,.35)}

  /* ── Load-in: text dries in after the ink reveal ────── */
  .inkin{opacity:0}
  .playing .inkin{
    animation:dry-in .9s cubic-bezier(.25,.6,.25,1) forwards;
  }
  .playing .inkin.d1{animation-delay:1.35s}
  .playing .inkin.d2{animation-delay:1.52s}
  .playing .inkin.d3{animation-delay:1.7s}
  @keyframes dry-in{
    from{opacity:0;transform:translateY(14px);filter:blur(6px)}
    60%{filter:blur(2.5px)}
    to{opacity:1;transform:none;filter:blur(0)}
  }

  /* Replay affordance for reviewing the motion */
  .replay{
    position:fixed;left:20px;bottom:18px;
    font-family:var(--mono);font-size:11px;letter-spacing:.48px;text-transform:uppercase;
    color:var(--el-midem);background:none;border:1px solid rgba(96,108,102,.3);
    border-radius:99px;padding:7px 14px;cursor:pointer;opacity:.75;
  }
  .replay:hover{opacity:1;color:var(--el-highem)}

  @media (prefers-reduced-motion:reduce){
    .inkin,.playing .inkin{animation:none;opacity:1}
    .replay{display:none}
  }
  @media (max-width:760px){
    .nav-links{display:none}
    .hero-copy h1{font-size:30px;line-height:38px}
    .hero-copy h1 br{display:none}
  }
</style>
</head>
<body>

<header class="navbar">
  <a class="logo" href="#">
    <!-- enso -->
    <svg width="21" height="21" viewBox="0 0 21 21" fill="none" aria-hidden="true">
      <path d="M17.6 6.7A8 8 0 1 0 18.5 11" stroke="#61a074" stroke-width="2.6" stroke-linecap="round"/>
    </svg>
    <b>zendō</b>
  </a>
  <nav class="nav-links">
    <a href="#">Benchmarks</a>
    <a href="#">Off-the-shelf</a>
    <a href="#">Careers</a>
  </nav>
  <a class="nav-clients" href="#">Clients</a>
</header>

<main class="hero">

  <!-- ═══ Hero illustration ═══
       The three watercolor layers are the exact Figma exports (zendo/assets/),
       wrapped by the ink-reveal mask; moving the cursor over the art smudges
       the pigment locally via the wet copy in #artWet. -->
  <div class="hero-art" id="heroArt" role="img"
       aria-label="Watercolor illustration of a green mountain reflected in still water beneath a pale green sun">
    <svg id="heroSvg" viewBox="0 -2 704 402" fill="none">
      <defs>

        <!-- Ink-blot reveal mask: feathered, lobed blot edge (video 1) -->
        <filter id="inkBlot" x="-60%" y="-60%" width="220%" height="220%" color-interpolation-filters="sRGB">
          <feTurbulence type="fractalNoise" baseFrequency="0.013" numOctaves="3" seed="5" result="n"/>
          <feDisplacementMap in="SourceGraphic" in2="n" scale="130" xChannelSelector="R" yChannelSelector="G" result="d1"/>
          <feTurbulence type="fractalNoise" baseFrequency="0.09" numOctaves="2" seed="8" result="n2"/>
          <feDisplacementMap in="d1" in2="n2" scale="26" xChannelSelector="R" yChannelSelector="G" result="d"/>
          <feGaussianBlur in="d" stdDeviation="3" result="b"/>
          <feComponentTransfer>
            <feFuncA type="linear" slope="14" intercept="-3"/>
          </feComponentTransfer>
        </filter>

        <!-- Wet-ink look for the smudge layer: pigment pushed around and
             softened, shown only inside the cursor's smudge mask -->
        <filter id="wetInk" x="-12%" y="-12%" width="124%" height="124%" color-interpolation-filters="sRGB">
          <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="4" result="n"/>
          <feDisplacementMap in="SourceGraphic" in2="n" scale="38" xChannelSelector="R" yChannelSelector="G" result="d1"/>
          <feTurbulence type="fractalNoise" baseFrequency="0.12" numOctaves="2" seed="9" result="n2"/>
          <feDisplacementMap in="d1" in2="n2" scale="13" xChannelSelector="R" yChannelSelector="G" result="d2"/>
          <feGaussianBlur in="d2" stdDeviation="3.6" result="b"/>
          <feColorMatrix in="b" type="saturate" values="0.92"/>
        </filter>

        <!-- Feathered, fibrous edge for the smudge blobs -->
        <filter id="blobSoft" x="-80%" y="-80%" width="260%" height="260%" color-interpolation-filters="sRGB">
          <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="7" result="n"/>
          <feDisplacementMap in="SourceGraphic" in2="n" scale="30" xChannelSelector="R" yChannelSelector="G" result="d"/>
          <feGaussianBlur in="d" stdDeviation="6"/>
        </filter>

        <!-- Smudge mask: ink blooms spawned along the cursor's path (video 3).
             JS grows each blob where the pointer touches, then dries it out. -->
        <mask id="smudgeMask" maskUnits="userSpaceOnUse" x="0" y="-2" width="704" height="402">
          <rect y="-2" width="704" height="402" fill="black"/>
          <g id="smudgeBlobs" filter="url(#blobSoft)"></g>
        </mask>


        <!-- ═══ Reveal mask: the ink blot grows to uncover the art ═══ -->
        <mask id="reveal" maskUnits="userSpaceOnUse" x="0" y="-2" width="704" height="402">
          <rect y="-2" width="704" height="402" fill="black"/>
          <g filter="url(#inkBlot)">
            <circle id="blotMain" cx="352" cy="185" r="0" fill="white">
              <animate attributeName="r" begin="0.12s" dur="2.2s" fill="freeze"
                       values="0;10;70;240;830" keyTimes="0;0.05;0.3;0.62;1"
                       calcMode="spline" keySplines=".4 0 .8 .4;.35 .2 .55 .9;.4 .1 .5 .95;.3 0 .2 1"/>
            </circle>
            <!-- satellite droplets the main blot swallows as it spreads -->
            <circle cx="205" cy="120" r="0" fill="white">
              <animate attributeName="r" begin="0.34s" dur="0.5s" fill="freeze"
                       values="0;14;18" keyTimes="0;0.5;1" calcMode="spline"
                       keySplines=".3 .7 .4 1;.3 0 .6 1"/>
            </circle>
            <circle cx="520" cy="300" r="0" fill="white">
              <animate attributeName="r" begin="0.46s" dur="0.5s" fill="freeze"
                       values="0;11;15" keyTimes="0;0.5;1" calcMode="spline"
                       keySplines=".3 .7 .4 1;.3 0 .6 1"/>
            </circle>
            <circle cx="590" cy="105" r="0" fill="white">
              <animate attributeName="r" begin="0.55s" dur="0.45s" fill="freeze"
                       values="0;9;12" keyTimes="0;0.5;1" calcMode="spline"
                       keySplines=".3 .7 .4 1;.3 0 .6 1"/>
            </circle>
          </g>
        </mask>
      </defs>

      <!-- ═══ The painting ═══ -->
      <g id="masked" mask="url(#reveal)">
        <!-- Exact Figma layer exports (2x), placed per the design's geometry.
             Water opacity (51%), sun crop/rotation are baked into the exports.
             The exports carry a flattened #fffcf3 ground; darken blending
             composites them the way Figma does, so the water tucks under the
             mountain and the grounds vanish against the page background. -->
        <g id="art">
          <image href="assets/water.png"    x="117.99" y="87.68" width="458.37" height="311.89" preserveAspectRatio="none" style="mix-blend-mode:darken"/>
          <image href="assets/sun.png"      x="259.41" y="-2"    width="48.34"  height="47.69"  preserveAspectRatio="none" style="mix-blend-mode:darken"/>
          <image href="assets/mountain.png" x="135.63" y="21.69" width="450.26" height="215.56" preserveAspectRatio="none" style="mix-blend-mode:darken"/>
        </g>
        <!-- Wet copy of the same art, visible only inside the smudge blobs -->
        <g id="artWet" filter="url(#wetInk)" mask="url(#smudgeMask)" style="display:none">
          <use href="#art"/>
        </g>
      </g>
    </svg>
  </div>

  <div class="hero-copy">
    <div>
      <h1 class="inkin d1">Zendō builds RL environments,<br>evals, and data for frontier AI labs.</h1>
      <p class="subtext inkin d2">Working as a trusted extension of a small number of labs, we build faithful
        worlds that train agents and surface the capabilities latent within them.</p>
    </div>
    <button class="cta inkin d3" type="button">Get started</button>
  </div>
</main>

<button class="replay" id="replay" type="button">&#8635;&nbsp;Replay ink</button>

<script>
(function(){
  var svg = document.getElementById('heroSvg');
  var art = document.getElementById('art');
  var hero = document.getElementById('heroArt');
  var reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ── Loading: ink-blot reveal ─────────────────────────
     The SMIL timeline in the mask drives the blot; here we just
     kick the text stagger, handle replay, and reduced motion. */
  function play(){
    document.body.classList.remove('playing');
    void document.body.offsetWidth;           /* restart CSS animations */
    svg.setCurrentTime(0);                    /* restart SMIL timeline  */
    document.body.classList.add('playing');
  }
  if (reduced){
    document.getElementById('masked').removeAttribute('mask');
  } else {
    play();
    document.getElementById('replay').addEventListener('click', play);
  }

  /* ── Hover: wet smudge around the cursor ──────────────
     Wherever the pointer travels, an ink bloom spawns in the smudge
     mask: it grows fast with a fibrous feathered edge, holds while
     wet, then dries away. The mask reveals #artWet — a copy of the
     painting with pigment displaced and softened — so the smudge
     stays local to the cursor's path. */
  var wetLayer = document.getElementById('artWet');
  var blobsG   = document.getElementById('smudgeBlobs');
  var NS = 'http://www.w3.org/2000/svg';
  var blobs = [], lastP = null, raf = null;
  var debugWet = location.search.indexOf('wet') > -1;

  function toViewBox(e){
    var r = svg.getBoundingClientRect();
    return { x: (e.clientX - r.left) / r.width * 704,
             y: (e.clientY - r.top) / r.height * 402 - 2 };
  }
  function spawn(p){
    if (blobs.length > 60) { var old = blobs.shift(); old.el.remove(); }
    var el = document.createElementNS(NS, 'circle');
    el.setAttribute('cx', p.x.toFixed(1));
    el.setAttribute('cy', p.y.toFixed(1));
    el.setAttribute('r', '0');
    el.setAttribute('fill', 'white');
    blobsG.appendChild(el);
    blobs.push({ el: el, born: performance.now(), rMax: 30 + Math.random() * 20 });
    wetLayer.style.display = '';
    if (!raf) raf = requestAnimationFrame(tick);
  }
  function tick(now){
    for (var i = blobs.length - 1; i >= 0; i--){
      var b = blobs[i], age = (now - b.born) / 1000;
      var t = Math.min(age / 0.45, 1);                  /* bloom ~0.45s   */
      var r = b.rMax * (1 - Math.pow(1 - t, 3)) + age * 3;   /* slow creep */
      var o = debugWet ? 1 :
              age < 0.9 ? 1 : 1 - (age - 0.9) / 1.6;    /* hold, then dry */
      if (o <= 0){ b.el.remove(); blobs.splice(i, 1); continue; }
      b.el.setAttribute('r', r.toFixed(1));
      b.el.setAttribute('opacity', o.toFixed(3));
    }
    if (blobs.length) raf = requestAnimationFrame(tick);
    else { raf = null; wetLayer.style.display = 'none'; }
  }
  if (!reduced){
    hero.addEventListener('pointermove', function(e){
      var p = toViewBox(e);
      if (!lastP || Math.hypot(p.x - lastP.x, p.y - lastP.y) >= 13){
        spawn(p); lastP = p;
      }
    });
  }
})();
</script>
</body>
</html>
