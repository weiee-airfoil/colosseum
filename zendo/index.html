<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zendō — RL environments, evals, and data for frontier AI labs</title>
<meta name="description" content="Zendō builds RL environments, evals, and data for frontier AI labs.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Substitutes for the Figma fonts (DGM Sprinter / Test Söhne / GT Flexa Mono are commercial):
     Hanken Grotesk covers headline + body, IBM Plex Mono covers the tracked nav caps. -->
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-primary:#fffcf3;        /* bg/primary */
    --el-highem:#191b19;         /* elements/highem */
    --el-midem:#606c66;          /* elements/midem */
    --el-secondary:#61a074;      /* elements/secondary */
    --sans:"Hanken Grotesk",-apple-system,"Segoe UI",sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{
    background:var(--bg-primary);
    color:var(--el-highem);
    font-family:var(--sans);
    display:flex;flex-direction:column;
    -webkit-font-smoothing:antialiased;
  }

  /* ── Navbar ─────────────────────────────────────────── */
  .navbar{
    height:64px;flex:none;
    display:flex;align-items:center;justify-content:space-between;
    padding:0 24px;position:relative;
  }
  .logo{display:flex;align-items:center;gap:7px;text-decoration:none;color:var(--el-highem)}
  .logo svg{display:block}
  .logo b{font-weight:500;font-size:19px;letter-spacing:.01em}
  .nav-links{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    display:flex;gap:32px;
  }
  .nav-links a,.nav-clients{
    font-family:var(--mono);font-size:12px;line-height:20px;
    letter-spacing:.48px;text-transform:uppercase;
    color:var(--el-midem);text-decoration:none;white-space:nowrap;
  }
  .nav-links a:hover,.nav-clients:hover{color:var(--el-highem)}

  /* ── Hero ───────────────────────────────────────────── */
  .hero{
    flex:1;display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    gap:48px;padding:32px 24px 80px;
  }
  .hero-art{
    width:704px;max-width:100%;
    cursor:pointer;position:relative;
  }
  .hero-art svg{display:block;width:100%;height:auto}
  #fluid{
    position:absolute;inset:0;width:100%;height:100%;
    pointer-events:none;opacity:0;transition:opacity .5s ease;
  }
  #fluid.on{opacity:1}

  .hero-copy{display:flex;flex-direction:column;align-items:center;gap:40px;text-align:center}
  .hero-copy h1{
    font-weight:300;font-size:40px;line-height:48px;letter-spacing:.4px;
    color:var(--el-highem);
  }
  .hero-copy .subtext{
    max-width:544px;margin-top:16px;
    font-size:16px;line-height:24px;color:var(--el-midem);
  }
  .cta{
    display:inline-flex;align-items:center;justify-content:center;
    height:44px;padding:0 24px;border:0;border-radius:99px;
    background:var(--el-secondary);color:var(--bg-primary);
    font-family:var(--sans);font-size:16px;font-weight:400;
    cursor:pointer;position:relative;overflow:hidden;
    transition:transform .25s ease,box-shadow .25s ease;
  }
  .cta:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(97,160,116,.35)}

  /* ── Load-in: text dries in after the ink reveal ────── */
  .inkin{opacity:0}
  .playing .inkin{
    animation:dry-in .9s cubic-bezier(.25,.6,.25,1) forwards;
  }
  .playing .inkin.d1{animation-delay:1.35s}
  .playing .inkin.d2{animation-delay:1.52s}
  .playing .inkin.d3{animation-delay:1.7s}
  @keyframes dry-in{
    from{opacity:0;transform:translateY(14px);filter:blur(6px)}
    60%{filter:blur(2.5px)}
    to{opacity:1;transform:none;filter:blur(0)}
  }

  /* Replay affordance for reviewing the motion */
  .replay{
    position:fixed;left:20px;bottom:18px;
    font-family:var(--mono);font-size:11px;letter-spacing:.48px;text-transform:uppercase;
    color:var(--el-midem);background:none;border:1px solid rgba(96,108,102,.3);
    border-radius:99px;padding:7px 14px;cursor:pointer;opacity:.75;
  }
  .replay:hover{opacity:1;color:var(--el-highem)}
  .lab-toggle{left:auto;right:20px}
  .lab{
    position:fixed;right:20px;bottom:60px;width:230px;
    background:var(--bg-primary);border:1px solid rgba(96,108,102,.3);
    border-radius:14px;padding:14px 16px 12px;
    box-shadow:0 10px 30px rgba(25,27,25,.08);
    font-family:var(--mono);font-size:10.5px;letter-spacing:.4px;
    text-transform:uppercase;color:var(--el-midem);
  }
  .lab__head{font-size:11px;color:var(--el-highem);margin-bottom:10px}
  .lab__row{
    display:grid;grid-template-columns:52px 1fr 34px;
    align-items:center;gap:8px;margin-bottom:8px;
  }
  .lab__row input{width:100%;accent-color:var(--el-secondary)}
  .lab__row output{text-align:right;font-variant-numeric:tabular-nums;color:var(--el-highem)}
  .lab__reset{
    margin-top:4px;width:100%;padding:6px 0;cursor:pointer;
    font:inherit;color:var(--el-midem);background:none;
    border:1px solid rgba(96,108,102,.3);border-radius:99px;
  }
  .lab__reset:hover{color:var(--el-highem)}
  @media (prefers-reduced-motion:reduce){.lab,.lab-toggle{display:none}}

  @media (prefers-reduced-motion:reduce){
    .inkin,.playing .inkin{animation:none;opacity:1}
    .replay{display:none}
  }
  @media (max-width:760px){
    .nav-links{display:none}
    .hero-copy h1{font-size:30px;line-height:38px}
    .hero-copy h1 br{display:none}
  }
</style>
</head>
<body>

<header class="navbar">
  <a class="logo" href="#">
    <!-- enso -->
    <svg width="21" height="21" viewBox="0 0 21 21" fill="none" aria-hidden="true">
      <path d="M17.6 6.7A8 8 0 1 0 18.5 11" stroke="#61a074" stroke-width="2.6" stroke-linecap="round"/>
    </svg>
    <b>zendō</b>
  </a>
  <nav class="nav-links">
    <a href="#">Benchmarks</a>
    <a href="#">Off-the-shelf</a>
    <a href="#">Careers</a>
  </nav>
  <a class="nav-clients" href="#">Clients</a>
</header>

<main class="hero">

  <!-- ═══ Hero illustration ═══
       The three watercolor layers are the exact Figma exports (zendo/assets/),
       wrapped by the ink-reveal mask. After the reveal, a WebGL layer takes
       over drawing the same artwork and liquefies it around the cursor. -->
  <div class="hero-art" id="heroArt" role="img"
       aria-label="Watercolor illustration of a green mountain reflected in still water beneath a pale green sun">
    <svg id="heroSvg" viewBox="0 -16 704 416" fill="none">
      <defs>

        <!-- Ink-blot reveal mask: feathered, lobed blot edge (video 1) -->
        <filter id="inkBlot" x="-60%" y="-60%" width="220%" height="220%" color-interpolation-filters="sRGB">
          <feTurbulence type="fractalNoise" baseFrequency="0.013" numOctaves="3" seed="5" result="n"/>
          <feDisplacementMap in="SourceGraphic" in2="n" scale="130" xChannelSelector="R" yChannelSelector="G" result="d1"/>
          <feTurbulence type="fractalNoise" baseFrequency="0.09" numOctaves="2" seed="8" result="n2"/>
          <feDisplacementMap in="d1" in2="n2" scale="26" xChannelSelector="R" yChannelSelector="G" result="d"/>
          <feGaussianBlur in="d" stdDeviation="3" result="b"/>
          <feComponentTransfer>
            <feFuncA type="linear" slope="14" intercept="-3"/>
          </feComponentTransfer>
        </filter>

        <!-- ═══ Reveal mask: the ink blot grows to uncover the art ═══ -->
        <mask id="reveal" maskUnits="userSpaceOnUse" x="0" y="-16" width="704" height="416">
          <rect y="-16" width="704" height="416" fill="black"/>
          <g filter="url(#inkBlot)">
            <circle id="blotMain" cx="352" cy="185" r="0" fill="white">
              <animate attributeName="r" begin="0.12s" dur="2.2s" fill="freeze"
                       values="0;10;70;240;830" keyTimes="0;0.05;0.3;0.62;1"
                       calcMode="spline" keySplines=".4 0 .8 .4;.35 .2 .55 .9;.4 .1 .5 .95;.3 0 .2 1"/>
            </circle>
            <!-- satellite droplets the main blot swallows as it spreads -->
            <circle cx="205" cy="120" r="0" fill="white">
              <animate attributeName="r" begin="0.34s" dur="0.5s" fill="freeze"
                       values="0;14;18" keyTimes="0;0.5;1" calcMode="spline"
                       keySplines=".3 .7 .4 1;.3 0 .6 1"/>
            </circle>
            <circle cx="520" cy="300" r="0" fill="white">
              <animate attributeName="r" begin="0.46s" dur="0.5s" fill="freeze"
                       values="0;11;15" keyTimes="0;0.5;1" calcMode="spline"
                       keySplines=".3 .7 .4 1;.3 0 .6 1"/>
            </circle>
            <circle cx="590" cy="105" r="0" fill="white">
              <animate attributeName="r" begin="0.55s" dur="0.45s" fill="freeze"
                       values="0;9;12" keyTimes="0;0.5;1" calcMode="spline"
                       keySplines=".3 .7 .4 1;.3 0 .6 1"/>
            </circle>
          </g>
        </mask>
      </defs>

      <!-- ═══ The painting ═══ -->
      <g id="masked" mask="url(#reveal)">
        <!-- Exact Figma layer exports (2x), placed per the design's geometry.
             Water opacity (51%) is baked into the exports; the sun is the
             uncropped source blob, color-matched to the design's crop.
             The exports carry a flattened #fffcf3 ground; darken blending
             composites them the way Figma does, so the water tucks under the
             mountain and the grounds vanish against the page background. -->
        <g id="art">
          <image href="assets/water.png"    x="117.99" y="87.68" width="458.37" height="311.89" preserveAspectRatio="none" style="mix-blend-mode:darken"/>
          <image href="assets/sun-full.png" x="246.6"  y="-15.2" width="74"     height="74"     preserveAspectRatio="none" style="mix-blend-mode:darken"/>
          <image href="assets/mountain.png" x="135.63" y="21.69" width="450.26" height="215.56" preserveAspectRatio="none" style="mix-blend-mode:darken"/>
        </g>
      </g>
    </svg>
    <!-- WebGL fluid-warp layer: renders the identical artwork and deforms it
         around the cursor; faded in only after the ink reveal completes. -->
    <canvas id="fluid" aria-hidden="true"></canvas>
  </div>

  <div class="hero-copy">
    <div>
      <h1 class="inkin d1">Zendō builds RL environments,<br>evals, and data for frontier AI labs.</h1>
      <p class="subtext inkin d2">Working as a trusted extension of a small number of labs, we build faithful
        worlds that train agents and surface the capabilities latent within them.</p>
    </div>
    <button class="cta inkin d3" type="button">Get started</button>
  </div>
</main>

<button class="replay" id="replay" type="button">&#8635;&nbsp;Replay ink</button>

<!-- Ink lab: live tuning for the hover smudge -->
<button class="replay lab-toggle" id="labToggle" type="button" aria-expanded="false">&#10035;&nbsp;Ink lab</button>
<div class="lab" id="lab" hidden>
  <div class="lab__head">Ink lab</div>
  <label class="lab__row">Smudge
    <input type="range" id="pStrength" min="0.02" max="0.30" step="0.005">
    <output></output></label>
  <label class="lab__row">Brush
    <input type="range" id="pRadius" min="0.002" max="0.060" step="0.001">
    <output></output></label>
  <label class="lab__row">Rebound
    <input type="range" id="pRebound" min="0" max="1" step="0.01">
    <output></output></label>
  <label class="lab__row">Organic
    <input type="range" id="pOrganic" min="0" max="1" step="0.01">
    <output></output></label>
  <label class="lab__row">Smear
    <input type="range" id="pSmear" min="0" max="2" step="0.05">
    <output></output></label>
  <button class="lab__reset" id="labReset" type="button">Reset</button>
</div>

<script>
(function(){
  var svg = document.getElementById('heroSvg');
  var hero = document.getElementById('heroArt');
  var canvas = document.getElementById('fluid');
  var reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ── Loading: ink-blot reveal ─────────────────────────
     The SMIL timeline in the mask drives the blot; here we just
     kick the text stagger, handle replay, and reduced motion.
     The fluid canvas hides during the reveal and fades in over
     the identical artwork once the ink has finished spreading. */
  var REVEAL_MS = 2450, revealTimer = null;
  function play(){
    fluidHide();
    document.body.classList.remove('playing');
    void document.body.offsetWidth;           /* restart CSS animations */
    svg.setCurrentTime(0);                    /* restart SMIL timeline  */
    document.body.classList.add('playing');
    clearTimeout(revealTimer);
    revealTimer = setTimeout(fluidShow, REVEAL_MS);
  }
  if (reduced){
    document.getElementById('masked').removeAttribute('mask');
  } else {
    play();
    document.getElementById('replay').addEventListener('click', play);
  }

  /* ── Hover: liquid warp around the cursor ─────────────
     A WebGL flowmap: every pointer move splats its velocity into a
     low-res, self-decaying flow field; the fragment shader drags the
     artwork's pixels along that field with a short motion smear, so
     the painting liquefies around the cursor and relaxes back. */
  var fluid = null;

  /* live-tunable smudge parameters (driven by the Ink lab panel) */
  var DEFAULTS = { strength: 0.11, radius: 0.011, rebound: 0.40, organic: 0.45, smear: 1.0 };
  var PARAMS = Object.assign({}, DEFAULTS);
  function dissipation(){ return 0.995 - PARAMS.rebound * 0.095; }

  function fluidShow(){ if (fluid){ canvas.classList.add('on'); fluid.kick(); } }
  function fluidHide(){ canvas.classList.remove('on'); }

  function initFluid(){
    var gl = canvas.getContext('webgl', { alpha: true, premultipliedAlpha: false, antialias: false });
    if (!gl) return null;

    /* compose the exact artwork (same sources, geometry and darken
       blending as the SVG) into a texture at the canvas's own pixel size,
       so the resting render is indistinguishable from the SVG */
    var layerData = null, artTex = null;
    function buildArtTexture(){
      if (!layerData || !canvas.width || !canvas.height) return;
      var art2d = document.createElement('canvas');
      art2d.width = canvas.width; art2d.height = canvas.height;
      var ctx = art2d.getContext('2d');
      ctx.fillStyle = '#fffcf3';
      ctx.fillRect(0, 0, art2d.width, art2d.height);
      ctx.globalCompositeOperation = 'darken';
      var sx = art2d.width / 704, sy = art2d.height / 416;
      layerData.forEach(function(l){
        ctx.drawImage(l.img, l.x * sx, (l.y + 16) * sy, l.w * sx, l.h * sy);
      });
      if (artTex) gl.deleteTexture(artTex);
      artTex = createTex(gl, art2d);
      if (canvas.classList.contains('on') && api) api.kick();
    }
    var layers = [].slice.call(document.querySelectorAll('#art image'));
    var pending = layers.length;
    layers.forEach(function(el){
      var img = new Image();
      img.onload = function(){
        el._img = { img: img,
          x: +el.getAttribute('x'), y: +el.getAttribute('y'),
          w: +el.getAttribute('width'), h: +el.getAttribute('height') };
        if (--pending === 0){
          layerData = layers.map(function(l){ return l._img; });
          buildArtTexture();
        }
      };
      img.src = el.getAttribute('href');
    });

    function compile(type, src){
      var sh = gl.createShader(type);
      gl.shaderSource(sh, src); gl.compileShader(sh);
      return sh;
    }
    function program(fs){
      var p = gl.createProgram();
      gl.attachShader(p, compile(gl.VERTEX_SHADER,
        'attribute vec2 aP;varying vec2 vUv;' +
        'void main(){vUv=aP*.5+.5;gl_Position=vec4(aP,0.,1.);}'));
      gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
      gl.linkProgram(p);
      return p;
    }
    function createTex(gl, source){
      var t = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, t);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, source);
      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
      return t;
    }
    function createFbo(w, h){
      var t = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, t);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE,
        new Uint8Array(w * h * 4).fill(128));
      var f = gl.createFramebuffer();
      gl.bindFramebuffer(gl.FRAMEBUFFER, f);
      gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
      return { fbo: f, tex: t };
    }

    /* flow field: RG encodes a velocity vector, 0.5 = zero */
    var FW = 240, FH = 137;
    var flowA = createFbo(FW, FH), flowB = createFbo(FW, FH);

    var splatProg = program(
      'precision mediump float;varying vec2 vUv;' +
      'uniform sampler2D uPrev;uniform vec2 uPoint,uVel;uniform float uDiss,uDecr,uRadius,uAspect;' +
      'void main(){' +
      '  vec2 v=(texture2D(uPrev,vUv).rg-.5)*2.;' +
      /* exponential decay plus a small linear decrement: the linear term
         always crosses the 8-bit quantization step, so the field reaches
         true zero instead of stalling on a frozen residual warp */
      '  v*=uDiss;' +
      '  float l=length(v);' +
      '  v*=l>1e-5?max(l-uDecr,0.)/l:0.;' +
      '  vec2 d=vUv-uPoint;d.x*=uAspect;' +
      '  v+=uVel*exp(-dot(d,d)/uRadius);' +
      '  v=clamp(v,-1.,1.);' +
      '  gl_FragColor=vec4(v*.5+.5,0.,1.);' +
      '}');

    var drawProg = program(
      'precision mediump float;varying vec2 vUv;' +
      'uniform sampler2D uFlow,uArt;uniform float uStrength,uOrganic,uSmear;' +
      'float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}' +
      'float noise(vec2 p){vec2 i=floor(p);vec2 f=fract(p);f=f*f*(3.-2.*f);' +
      ' return mix(mix(hash(i),hash(i+vec2(1.,0.)),f.x),' +
      '            mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),f.x),f.y);}' +
      'void main(){' +
      '  vec2 flow=(texture2D(uFlow,vUv).rg-.5)*2.;' +
      '  flow*=smoothstep(.0045,.010,length(flow));' +
      /* value noise breaks the warp into uneven, watercolor-ish tendrils */
      '  float m=1.+uOrganic*(noise(vUv*46.)-.5)*2.4;' +
      '  vec2 wob=(vec2(noise(vUv*27.+9.1),noise(vUv*27.+3.7))-.5)*2.;' +
      '  vec2 off=flow*uStrength*m+wob*length(flow)*uStrength*uOrganic*1.4;' +
      '  vec4 c=vec4(0.);' +
      '  c+=texture2D(uArt,vUv-off*(0.85-0.30*uSmear));' +
      '  c+=texture2D(uArt,vUv-off*0.85);' +
      '  c+=texture2D(uArt,vUv-off*(0.85+0.30*uSmear));' +
      '  gl_FragColor=c/3.;' +
      '}');

    var quad = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, quad);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
    function bindQuad(p){
      var loc = gl.getAttribLocation(p, 'aP');
      gl.bindBuffer(gl.ARRAY_BUFFER, quad);
      gl.enableVertexAttribArray(loc);
      gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    }

    var pointer = { x: .5, y: .5, vx: 0, vy: 0, has: false };
    var lastMoveT = 0, lastT = 0, raf = null;

    function frame(now){
      /* time-based decay: drying takes the same wall-clock time at any fps */
      var dt = lastT ? Math.min(Math.max((now - lastT) / 16.7, 0.25), 30) : 1;
      lastT = now;
      /* advance the flow field */
      gl.bindFramebuffer(gl.FRAMEBUFFER, flowB.fbo);
      gl.viewport(0, 0, FW, FH);
      gl.useProgram(splatProg); bindQuad(splatProg);
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, flowA.tex);
      gl.uniform1i(gl.getUniformLocation(splatProg, 'uPrev'), 0);
      gl.uniform2f(gl.getUniformLocation(splatProg, 'uPoint'), pointer.x, pointer.y);
      gl.uniform2f(gl.getUniformLocation(splatProg, 'uVel'),
        pointer.has ? pointer.vx : 0, pointer.has ? pointer.vy : 0);
      gl.uniform1f(gl.getUniformLocation(splatProg, 'uDiss'), Math.pow(dissipation(), dt));
      gl.uniform1f(gl.getUniformLocation(splatProg, 'uDecr'), 0.0045 * dt);
      gl.uniform1f(gl.getUniformLocation(splatProg, 'uRadius'), PARAMS.radius);
      gl.uniform1f(gl.getUniformLocation(splatProg, 'uAspect'), 704 / 416);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      pointer.vx = pointer.vy = 0; pointer.has = false;
      var t = flowA; flowA = flowB; flowB = t;

      /* draw the warped artwork */
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      gl.viewport(0, 0, canvas.width, canvas.height);
      gl.useProgram(drawProg); bindQuad(drawProg);
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, flowA.tex);
      gl.uniform1i(gl.getUniformLocation(drawProg, 'uFlow'), 0);
      gl.activeTexture(gl.TEXTURE1);
      gl.bindTexture(gl.TEXTURE_2D, artTex);
      gl.uniform1i(gl.getUniformLocation(drawProg, 'uArt'), 1);
      gl.uniform1f(gl.getUniformLocation(drawProg, 'uStrength'), PARAMS.strength);
      gl.uniform1f(gl.getUniformLocation(drawProg, 'uOrganic'), PARAMS.organic);
      gl.uniform1f(gl.getUniformLocation(drawProg, 'uSmear'), PARAMS.smear);
      gl.drawArrays(gl.TRIANGLES, 0, 3);

      /* keep integrating until the flow has fully drained; slower
         rebound holds the smudge longer */
      var drainMs = Math.min(30000,
        (Math.log(0.005) / Math.log(dissipation())) * 16.7 + 800);
      if (now - lastMoveT < drainMs) raf = requestAnimationFrame(frame);
      else { raf = null; lastT = 0; }
    }

    function resize(){
      var r = canvas.getBoundingClientRect();
      var dpr = Math.min(devicePixelRatio || 1, 2);
      canvas.width = Math.round(r.width * dpr);
      canvas.height = Math.round(r.height * dpr);
    }
    resize();
    addEventListener('resize', function(){ resize(); buildArtTexture(); });

    var api = {
      kick: function(){ if (!raf && artTex) raf = requestAnimationFrame(frame); },
      ready: function(){ return !!artTex; },
      move: function(x, y, dx, dy){
        pointer.x = x; pointer.y = 1 - y;
        /* velocity in uv units, flipped for GL, clamped for stability */
        pointer.vx = Math.max(-1, Math.min(1, dx * 9));
        pointer.vy = Math.max(-1, Math.min(1, -dy * 9));
        pointer.has = true;
        lastMoveT = performance.now();
        if (!raf && artTex) raf = requestAnimationFrame(frame);
      }
    };
    return api;
  }

  if (!reduced){
    fluid = initFluid();
    if (fluid){
      var lastP = null;
      hero.addEventListener('pointermove', function(e){
        var r = canvas.getBoundingClientRect();
        var x = (e.clientX - r.left) / r.width;
        var y = (e.clientY - r.top) / r.height;
        if (lastP) fluid.move(x, y, x - lastP.x, y - lastP.y);
        lastP = { x: x, y: y };
      });
      hero.addEventListener('pointerleave', function(){ lastP = null; });
    }

    /* ── Ink lab panel ── */
    var lab = document.getElementById('lab');
    var labToggle = document.getElementById('labToggle');
    labToggle.addEventListener('click', function(){
      var open = lab.hidden;
      lab.hidden = !open;
      labToggle.setAttribute('aria-expanded', String(open));
    });
    var sliders = {
      strength: document.getElementById('pStrength'),
      radius:   document.getElementById('pRadius'),
      rebound:  document.getElementById('pRebound'),
      organic:  document.getElementById('pOrganic'),
      smear:    document.getElementById('pSmear')
    };
    function syncPanel(){
      Object.keys(sliders).forEach(function(k){
        sliders[k].value = PARAMS[k];
        sliders[k].nextElementSibling.value = (+PARAMS[k]).toFixed(k === 'radius' ? 3 : 2);
      });
    }
    Object.keys(sliders).forEach(function(k){
      sliders[k].addEventListener('input', function(){
        PARAMS[k] = +sliders[k].value;
        sliders[k].nextElementSibling.value = (+PARAMS[k]).toFixed(k === 'radius' ? 3 : 2);
        if (fluid) fluid.kick();
      });
    });
    document.getElementById('labReset').addEventListener('click', function(){
      PARAMS = Object.assign({}, DEFAULTS);
      syncPanel();
      if (fluid) fluid.kick();
    });
    syncPanel();
  }
})();
</script>
</body>
</html>
