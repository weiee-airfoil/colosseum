name: Fetch hero assets
on:
  push:
    branches:
      - claude/hero-illustration-loading-animation-6jozom

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download assets
        run: |
          if [ ! -f zendo/fetch-urls.json ]; then
            echo "No manifest, nothing to do."; exit 0
          fi
          mkdir -p zendo/assets/raw
          done_all=true
          jq -r 'to_entries[] | "\(.key) \(.value)"' zendo/fetch-urls.json |
          while read -r name url; do
            [ -f "zendo/assets/raw/${name}.png" ] && continue
            curl -fsSL -o "zendo/assets/raw/${name}.png" "$url"
          done
          file zendo/assets/raw/*.png
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add zendo/assets
          git diff --cached --quiet && exit 0
          git commit -m "Add raw sun source candidates"
          git push origin HEAD:${GITHUB_REF_NAME}
