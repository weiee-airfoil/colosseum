name: Fetch hero assets
on:
  push:
    branches:
      - claude/hero-illustration-loading-animation-6jozom

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download assets
        run: |
          if [ -f zendo/assets/mountain.png ]; then
            echo "Assets already present, nothing to do."
            exit 0
          fi
          mkdir -p zendo/assets
          jq -r 'to_entries[] | "\(.key) \(.value)"' zendo/fetch-urls.json |
          while read -r name url; do
            curl -fsSL -o "zendo/assets/${name}.png" "$url"
          done
          file zendo/assets/*.png
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add zendo/assets
          git commit -m "Add hero watercolor layer exports"
          git push origin HEAD:${GITHUB_REF_NAME}
