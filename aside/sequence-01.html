<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aside — logo sequences 01–04</title>
<meta name="description" content="Sequence 01 of the Aside logo animation: the sparkle arrives from full screen, the monogram forms, its glow breathes, four omnibars type in, and the mark pulls them in like a black hole.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Geist:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --ui: rgba(237, 232, 226, 0.6);
    --ui-dim: rgba(237, 232, 226, 0.3);
    --mono: "IBM Plex Mono", "SFMono-Regular", Menlo, monospace;
  }
  html, body { height: 100%; }
  body { margin: 0; background: #211C15; overflow: hidden; font-family: var(--mono); color: var(--ui); }
  .stage { position: fixed; inset: 0; }
  .stage svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

  .chrome { transition: opacity 0.5s ease; }
  .chrome.is-idle { opacity: 0; pointer-events: none; }

  .vtabs {
    position: fixed;
    top: clamp(2.6rem, 5vw, 3.4rem);
    left: 1rem;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 0.35rem;
    max-width: 200px;
    padding: 0.45rem 0.6rem;
    background: rgba(20, 16, 12, 0.55);
    border: 1px solid rgba(237, 232, 226, 0.14);
    border-radius: 14px;
    backdrop-filter: blur(14px);
    z-index: 5;
  }
  .vtabs button {
    font: inherit;
    font-size: 0.625rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ui);
    background: rgba(237, 232, 226, 0.06);
    border: 1px solid rgba(237, 232, 226, 0.2);
    border-radius: 999px;
    padding: 0.35rem 0.7rem;
    cursor: pointer;
  }
  .vtabs button:hover { border-color: rgba(237, 232, 226, 0.5); }
  .vtabs button[aria-pressed="true"] {
    background: rgba(237, 232, 226, 0.22);
    border-color: rgba(237, 232, 226, 0.6);
    color: #fff;
  }

  .marginalia {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; gap: 1rem;
    padding: clamp(1rem, 2.5vw, 1.75rem) clamp(1.25rem, 3vw, 2.25rem);
    font-size: 0.6875rem; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--ui-dim); pointer-events: none;
    text-shadow: 0 1px 8px rgba(0,0,0,0.5);
  }

  .deck {
    position: fixed; left: 50%; bottom: clamp(1rem, 3vh, 2rem);
    transform: translateX(-50%);
    width: min(560px, calc(100vw - 3rem));
    display: grid; gap: 0.7rem; justify-items: center;
    padding: 0.9rem 1.1rem;
    background: rgba(20, 16, 12, 0.55);
    border: 1px solid rgba(237, 232, 226, 0.14);
    border-radius: 16px;
    backdrop-filter: blur(14px);
  }
  .deck__scrub {
    width: 100%; display: flex; align-items: center; gap: 0.75rem;
    font-size: 0.625rem; letter-spacing: 0.14em; color: var(--ui-dim);
    font-variant-numeric: tabular-nums;
  }
  .deck__scrub input {
    flex: 1; appearance: none; height: 2px;
    background: rgba(237, 232, 226, 0.25); border-radius: 1px;
    outline-offset: 6px; cursor: pointer;
  }
  .deck__scrub input::-webkit-slider-thumb {
    appearance: none; width: 12px; height: 12px; border-radius: 50%;
    background: rgba(237, 232, 226, 0.9); border: 0;
  }
  .deck__scrub input::-moz-range-thumb {
    width: 12px; height: 12px; border-radius: 50%;
    background: rgba(237, 232, 226, 0.9); border: 0;
  }
  .deck__controls { display: flex; gap: 0.5rem; }
  .deck__controls button {
    font: inherit; font-size: 0.6875rem; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--ui); background: rgba(237, 232, 226, 0.07);
    border: 1px solid rgba(237, 232, 226, 0.22); border-radius: 999px;
    padding: 0.5rem 1.15rem; cursor: pointer;
    transition: border-color 0.2s ease, background 0.2s ease;
  }
  .deck__controls button:hover { border-color: rgba(237, 232, 226, 0.55); }
  .deck__controls button:focus-visible { outline: 2px solid rgba(237, 232, 226, 0.8); outline-offset: 2px; }
  .deck__controls button[aria-pressed="true"] {
    background: rgba(237, 232, 226, 0.18); border-color: rgba(237, 232, 226, 0.55);
  }
</style>
</head>

  /* Sample the pill capsule outline (local coords, centred) */
  function capsulePoints(w, h, N) {
    var r = h / 2, a = w / 2 - r;
    var straight = Math.max(0, w - h);
    var per = 2 * straight + Math.PI * h;
    var pts = [];
    for (var i = 0; i < N; i++) {
      var sPos = per * i / N;
      if (sPos < straight) {                       /* top edge, L->R */
        pts.push([-a + sPos, -r]);
      } else if (sPos < straight + Math.PI * r) {  /* right cap */
        var t1 = (sPos - straight) / r;
        pts.push([a + r * Math.sin(t1), -r * Math.cos(t1)]);
      } else if (sPos < 2 * straight + Math.PI * r) { /* bottom edge, R->L */
        pts.push([a - (sPos - straight - Math.PI * r), r]);
      } else {                                     /* left cap */
        var t2 = (sPos - 2 * straight - Math.PI * r) / r;
        pts.push([-a - r * Math.sin(t2), r * Math.cos(t2)]);

  /* Gooey pull: every point falls toward the mark on its own delayed
     clock — the near edge grabbed first, the far edge dragged after,
     with a slight surface-tension resist. */
  var GOO_LAG = 0.32, GOO_C1 = 0.8;

  function gooWarp(px, py, cx, cy, t, dmin, dmax) {
    var d = Math.hypot(px - cx, py - cy);

    var u = clamp01((t - delay * GOO_LAG) / (1 - GOO_LAG));

    return [px + (cx - px) * prog, py + (cy - py) * prog];
  }

  function gooPath(w, h, cx, cy, t) {
    var pts = capsulePoints(w, h, 44);
    var dmin = Infinity, dmax = 0, i, d;
    for (i = 0; i < pts.length; i++) {
      d = Math.hypot(pts[i][0] - cx, pts[i][1] - cy);
      if (d < dmin) { dmin = d; }
      if (d > dmax) { dmax = d; }

    var out = [];
    for (i = 0; i < pts.length; i++) {

  /* Content is glued to the goo: its box corners are pushed through the

  function gooContent(el, xL, xR, hh, lcx, lcy, t, gm) {

    var pB = gooWarp((xL + xR) / 2, hh, lcx, lcy, t, gm.dmin, gm.dmax);
    var sx = Math.max((pR[0] - pL[0]) / (xR - xL), 0.01);

  /* Renders one omnibar: flight progress k (1 = off-canvas, 0 = landed),

  function setBar(bar, opacity, k, scale, blur, n, caretOn, suckT, creep) {

    var padL = fs * 0.62, padR = fs, gap = fs * 0.18;
    var iconS = fs * 1.35, iconGap = fs * 0.42;
    var pillW = padL + iconS + iconGap + textW + (n > 0 ? gap : gap * 0.5) + fs / 8 + padR;
    var pillH = fs * 2.55;
    bar.pill.setAttribute('x', -pillW / 2);
    bar.pill.setAttribute('y', -pillH / 2);
    bar.pill.setAttribute('width', pillW);
    bar.pill.setAttribute('height', pillH);
    bar.pill.setAttribute('rx', pillH / 2);
    bar.iconEl.setAttribute('x', -pillW / 2 + padL);
    bar.iconEl.setAttribute('y', -iconS / 2);

    bar.textEl.setAttribute('y', fs * 0.36);

    bar.caretEl.setAttribute('opacity', caretOn ? 1 : 0);

    var y = bar.cy + bar.from[1] * k;

    y = y + (939 - y) * creep;
    var transform;
    if (suckT > 0 && PULL_MODE === 'gooey') {
      /* The pill itself deforms: grabbed by the point nearest the mark
         and dragged in like taffy. No frame rotation, no downscale. */

      bar.gooEl.setAttribute('display', '');
      bar.pill.setAttribute('display', 'none');

      y = y + (939 - y) * pull;

      blur = Math.max(blur, 7 * seg(suckT, 0.7, 1));
      transform = 'translate(' + x + ' ' + y + ') scale(' + shrink + ') rotate(-0.25)';
    } else {
      bar.gooEl.setAttribute('display', 'none');
      bar.pill.setAttribute('display', '');
      bar.iconEl.setAttribute('opacity', 1);
      bar.iconEl.removeAttribute('transform');
      bar.textEl.setAttribute('opacity', 1);
      bar.textEl.removeAttribute('transform');
      transform = 'translate(' + x + ' ' + y + ') scale(' + scale + ') rotate(' + (-0.25 + (bar.rotE || 0)) + ')';

    bar.g.setAttribute('transform', transform);
    var f = 'drop-shadow(0 0 2px rgba(0,0,0,0.6)) drop-shadow(0 20px 48px rgba(0,0,0,0.2))';

  /* ---------------------------------------------------------------- *
   * Easing

  function clamp01(t) { return Math.min(1, Math.max(0, t)); }

  var BREATH = 2800;
  var FLY = 800;

  var BLINK = 1400;          /* caret blink cycle; 2 cycles per loop window */
  var HOLD = 350;            /* blink beat between typing out and the pull */
  var SUCK_DUR = 780;

  var markG = document.getElementById('mark');
  var gyroRing = document.getElementById('gyroRing');
  var gyroInner = document.getElementById('gyroInner');
  var gyroStar = document.getElementById('gyroStar');
  var ringProcG = document.getElementById('gyroRingProc');

  var VARIANTS = [

    { name: '4 stroke orbit', ringProc: true, bandProc: true,

    { name: '5 stroke lazy', ringProc: true, bandProc: true,

      } },
    { name: '8 stroke sequential', ringProc: true, bandProc: true,
      fn: function (gt) {

        var e = function (t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; };
        var ringTurn = c < 0.5 ? e(c * 2) : 1;
        var bandTurn = c < 0.5 ? 0 : e((c - 0.5) * 2);

        setProcBand(TAU * bandTurn, -20 * Math.sin(TAU * c));
        sway(gt, 5);
      } },
    { name: '9 stroke gimbal', ringProc: true, bandProc: true,
      fn: function (gt) {

        bandProc.setAttribute('rx', BAND_MIN * m * PULSE);

  var currentVariant = 2; /* stroke classic as default */

  function applyVariantVisibility() {
    var v = VARIANTS[currentVariant];

  function introFor(wrap, t0, ms) {

      gyroInner.style.display = '';

        gyroRing.style.transform = 'none';

  var welcome = document.getElementById('welcome');

  var ENDING = 'top';
  var END_TOP = { x: 1459, y: 248, s: 0.308 };

  function renderWelcome(ms) {

    ];
    welcome.setAttribute('opacity', Math.max(rises[0], 0.001));
    for (var i = 0; i < els.length; i++) {
      els[i].setAttribute('opacity', rises[i]);
      els[i].setAttribute('transform', 'translate(0 ' + (14 * (1 - rises[i])) + ')');
    }
  }

  var shims = [0, 1, 2, 3].map(function (i) {
    return document.getElementById('shim' + i);
  });

  function renderBars(ms) {
    for (var i = 0; i < BARS.length; i++) {
      var bar = BARS[i];
      var local = ms - bar.enter;
      if (local <= 0) { bar.g.setAttribute('opacity', 0); continue; }
      /* position arrives early; size and focus settle late, so the bar
         sails in still huge and soft, then compresses into place */
      var glide = seg(local, 0, FLY, easeOutQuint);
      var settle = seg(local, 0, FLY * 1.15, easeInOut);
      var opacity = seg(local, 0, 260, easeOut);
      var k = 1 - glide;
      var scale = lerp(3.0, 1, easeOutBack(settle));
      var blur = 22 * (1 - settle);
      bar.rotE = -5 * (1 - settle);
      var typed = Math.floor(Math.max(0, local - TYPE_DELAY) / TYPE_MS);
      var n = Math.min(bar.text.length, typed);
      var done = n >= bar.text.length;
      var suckT = clamp01((ms - bar.suckAt) / SUCK_DUR);
      var caretOn = suckT === 0 && local > TYPE_DELAY - 100 &&
        (!done || (ms % BLINK) < BLINK * 0.55);
      if (suckT >= 1) { bar.g.setAttribute('opacity', 0); continue; }
      var creep = 1 - Math.exp(-Math.max(0, local - FLY * 0.6) * 0.000052);
      /* the shimmer starts sweeping the moment this bar types its first
         letter; before that the band is parked off-text */
      var typeLocal = local - TYPE_DELAY;
      var ph = typeLocal > 0 ? ((typeLocal % 1400) / 1400) * 2.4 - 1.2 : -1.2;
      shims[i].setAttribute('gradientTransform', 'translate(' + ph + ' 0)');
      setBar(bar, opacity, k, scale, blur, n, caretOn, suckT, creep);
    }
  }

  /* ------------------------------------------------------------ *
   * Shockwave: when the sparkle lands, a single ripple warps the
   * whole scene behind the logo. The background moves onto a WebGL
   * canvas (the SVG <image> stays as fallback when WebGL is absent).
   * ------------------------------------------------------------ */

  var SHOCK_START = 1430, SHOCK_FLY = 2600, SHOCK_DUR = 1600;
  var bgCanvas = document.getElementById('bggl');
  var bgImageEl = document.querySelector('#stage svg image');
  var glOK = false, gl, glU = {};

  (function initGL() {
    try { gl = bgCanvas.getContext('webgl', { antialias: false, alpha: false }); }
    catch (e) { gl = null; }
    if (!gl) { return; }
    var vs = 'attribute vec2 aP; void main(){ gl_Position = vec4(aP, 0.0, 1.0); }';
    var fs = 'precision mediump float;' +
      'uniform vec2 uRes; uniform vec2 uOff; uniform float uScl;' +
      'uniform sampler2D uTex; uniform vec2 uCenter;' +
      'uniform float uR; uniform float uW; uniform float uAmp;' +
      'void main(){' +
      '  vec2 ppx = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y);' +
      '  vec2 scene = uOff + ppx * uScl;' +
      '  vec2 rel = scene - uCenter;' +
      '  float d = max(length(rel), 0.001);' +
      '  float x = (d - uR) / uW;' +
      '  float g = exp(-x * x);' +
      '  vec2 s2 = scene - (rel / d) * g * uAmp;' +
      '  vec2 uv = clamp(s2 / vec2(2918.0, 1878.0), 0.0, 1.0);' +
      '  vec3 c = texture2D(uTex, uv).rgb;' +
      '  c += g * uAmp * 0.0035;' +
      '  gl_FragColor = vec4(c, 1.0);' +
      '}';
    function sh(type, src) {
      var o = gl.createShader(type);
      gl.shaderSource(o, src); gl.compileShader(o);
      return gl.getShaderParameter(o, gl.COMPILE_STATUS) ? o : null;
    }
    var v = sh(gl.VERTEX_SHADER, vs), f = sh(gl.FRAGMENT_SHADER, fs);
    if (!v || !f) { return; }
    var pr = gl.createProgram();
    gl.attachShader(pr, v); gl.attachShader(pr, f); gl.linkProgram(pr);
    if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) { return; }
    gl.useProgram(pr);
    var buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    var aP = gl.getAttribLocation(pr, 'aP');
    gl.enableVertexAttribArray(aP);
    gl.vertexAttribPointer(aP, 2, gl.FLOAT, false, 0, 0);
    ['uRes', 'uOff', 'uScl', 'uCenter', 'uR', 'uW', 'uAmp'].forEach(function (n) {
      glU[n] = gl.getUniformLocation(pr, n);
    });
    var img = new Image();
    img.onload = function () {
      var tex = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, tex);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, img);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      glOK = true;
      bgImageEl.style.display = 'none';
      renderBG(0);
    };
    img.src = bgImageEl.getAttribute('href');
  })();

  function renderBG(ms) {
    if (!glOK) { return; }
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var cw = Math.round(bgCanvas.clientWidth * dpr);
    var ch = Math.round(bgCanvas.clientHeight * dpr);
    if (bgCanvas.width !== cw || bgCanvas.height !== ch) {
      bgCanvas.width = cw; bgCanvas.height = ch;
      gl.viewport(0, 0, cw, ch);
    }
    var scl = 1 / Math.max(cw / 2918, ch / 1878);
    gl.uniform2f(glU.uRes, cw, ch);
    gl.uniform1f(glU.uScl, scl);
    gl.uniform2f(glU.uOff, (2918 - cw * scl) / 2, (1878 - ch * scl) / 2);
    gl.uniform2f(glU.uCenter, 1459, 939);
    var shockAt = (typeof RING_INTRO !== 'undefined' && RING_INTRO === 'fly') ? SHOCK_FLY : SHOCK_START;
    var t = clamp01((ms - shockAt) / SHOCK_DUR);
    var travel = 1 - Math.pow(1 - t, 3);
    gl.uniform1f(glU.uR, 2300 * travel);
    gl.uniform1f(glU.uW, 110 + 220 * travel);
    gl.uniform1f(glU.uAmp, (t <= 0 || t >= 1) ? 0 : 26 * Math.pow(1 - t, 1.6));
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  function renderAt(ms) {
    renderBG(ms);
    renderArrival(Math.min(ms, 2600) / 1000);
    renderGlow(ms);
    renderBars(ms);
  }

  /* ---------------------------------------------------------------- *
   * Player
   * ---------------------------------------------------------------- */

  var scrub = document.getElementById('scrub');
  var clock = document.getElementById('clock');
  var clockEnd = document.getElementById('clockEnd');
  var replayBtn = document.getElementById('replay');
  var slowBtn = document.getElementById('slow');

  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var slow = false;
  var raf = 0;
  var startStamp = 0;

  clockEnd.textContent = (TOTAL / 1000).toFixed(2) + 's';

  function show(ms) {
    if (ms > TOTAL) { ms = LOOP_HEAD + ((ms - LOOP_HEAD) % BREATH); }
    renderAt(ms);
    scrub.value = String(Math.round((ms / TOTAL) * 1000));
    clock.textContent = (ms / 1000).toFixed(2) + 's';
  }

  function frame(now) {
    show((now - startStamp) / (slow ? 3 : 1));
    raf = requestAnimationFrame(frame);   /* breathes and blinks forever */
  }

  function play() {
    cancelAnimationFrame(raf);
    if (reduced) { show(TOTAL - BREATH / 4); return; }
    raf = requestAnimationFrame(function (now) {
      startStamp = now;
      frame(now);
    });
  }

  scrub.addEventListener('input', function () {
    cancelAnimationFrame(raf);
    show((Number(scrub.value) / 1000) * TOTAL);
  });
  replayBtn.addEventListener('click', play);
  slowBtn.addEventListener('click', function () {
    slow = !slow;
    slowBtn.setAttribute('aria-pressed', String(slow));
    play();
  });
  document.getElementById('stage').addEventListener('click', play);

  /* Variant tabs (temporary picker) */
  var vtabs = document.getElementById('vtabs');
  VARIANTS.forEach(function (v, i) {
    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = v.name;
    b.setAttribute('role', 'tab');
    b.setAttribute('aria-pressed', String(i === currentVariant));
    b.addEventListener('click', function () {
      currentVariant = i;
      applyVariantVisibility();
      vtabs.querySelectorAll('button').forEach(function (x, j) {
        x.setAttribute('aria-pressed', String(j === currentVariant));
      });
      playFrom(LOOP_HEAD); /* jump straight to the spinning mark */
    });
    vtabs.appendChild(b);
  });
  applyVariantVisibility();

  function playFrom(ms0) {
    cancelAnimationFrame(raf);
    if (reduced) { show(ms0); return; }
    raf = requestAnimationFrame(function (now) {
      startStamp = now - ms0 * (slow ? 3 : 1);
      frame(now);
    });
  }

  /* Ending tabs (temporary picker #2) */
  var etabs = document.getElementById('etabs');
  [['end: logo on top', 'top'], ['end: logo inline', 'inline']].forEach(function (opt, i) {
    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = opt[0];
    b.setAttribute('role', 'tab');
    b.setAttribute('aria-pressed', String(opt[1] === ENDING));
    b.addEventListener('click', function () {
      ENDING = opt[1];
      etabs.querySelectorAll('button').forEach(function (x, j) {
        x.setAttribute('aria-pressed', String(j === i));
      });
      playFrom(SETTLE_START - 900); /* preview the transition */
    });
    etabs.appendChild(b);
  });

  /* Ring-intro tabs (temporary picker #3) */
  var rtabs = document.getElementById('rtabs');
  [['rings: fade in spinning', 'fade'], ['rings: fly in from front', 'fly']].forEach(function (opt, i) {
    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = opt[0];
    b.setAttribute('role', 'tab');
    b.setAttribute('aria-pressed', String(opt[1] === RING_INTRO));
    b.addEventListener('click', function () {
      RING_INTRO = opt[1];
      rtabs.querySelectorAll('button').forEach(function (x, j) {
        x.setAttribute('aria-pressed', String(j === i));
      });
      playFrom(700); /* preview the arrival with this ring intro */
    });
    rtabs.appendChild(b);
  });

  /* Pull-style tabs (temporary picker #4) */
  var ptabs = document.getElementById('ptabs');
  [['pull: gooey', 'gooey'], ['pull: straight', 'straight']].forEach(function (opt, i) {
    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = opt[0];
    b.setAttribute('role', 'tab');
    b.setAttribute('aria-pressed', String(opt[1] === PULL_MODE));
    b.addEventListener('click', function () {
      PULL_MODE = opt[1];
      ptabs.querySelectorAll('button').forEach(function (x, j) {
        x.setAttribute('aria-pressed', String(j === i));
      });
      playFrom(BARS[0].suckAt - 700); /* preview a pull directly */
    });
    ptabs.appendChild(b);
  });

  /* Idle chrome */
  var chrome = document.querySelectorAll('.chrome');
  var idleTimer = 0;
  function wake() {
    chrome.forEach(function (el) { el.classList.remove('is-idle'); });
    clearTimeout(idleTimer);
    idleTimer = setTimeout(function () {
      chrome.forEach(function (el) { el.classList.add('is-idle'); });
    }, 2600);
  }
  ['pointermove', 'pointerdown', 'keydown', 'touchstart'].forEach(function (ev) {
    window.addEventListener(ev, wake, { passive: true });
  });
  wake();

  show(0);
  play();
})();
</script>
</body>
</html>
