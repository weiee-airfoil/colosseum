<title>Aside — logo sequences 01–03</title>
<meta name="description" content="Sequence 01 of the Aside logo animation: the sparkle arrives from full screen, the exact monogram forms, its glow breathes, and the omnibars fly in and type over the desktop scene.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Geist:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --ui: rgba(237, 232, 226, 0.6);
    --ui-dim: rgba(237, 232, 226, 0.3);
    --mono: "IBM Plex Mono", "SFMono-Regular", Menlo, monospace;
  }
  html, body { height: 100%; }
  body { margin: 0; background: #211C15; overflow: hidden; font-family: var(--mono); color: var(--ui); }
  .stage { position: fixed; inset: 0; }
  .stage svg { position: absolute; inset: 0; width: 100%; height: 100%; }

  .chrome { transition: opacity 0.5s ease; }
  .chrome.is-idle { opacity: 0; pointer-events: none; }

  .marginalia {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; gap: 1rem;
    padding: clamp(1rem, 2.5vw, 1.75rem) clamp(1.25rem, 3vw, 2.25rem);
    font-size: 0.6875rem; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--ui-dim); pointer-events: none;
    text-shadow: 0 1px 8px rgba(0,0,0,0.5);
  }

  .deck {
    position: fixed; left: 50%; bottom: clamp(1rem, 3vh, 2rem);
    transform: translateX(-50%);
    width: min(560px, calc(100vw - 3rem));
    display: grid; gap: 0.7rem; justify-items: center;
    padding: 0.9rem 1.1rem;
    background: rgba(20, 16, 12, 0.55);
    border: 1px solid rgba(237, 232, 226, 0.14);
    border-radius: 16px;
    backdrop-filter: blur(14px);
  }
  .deck__scrub {
    width: 100%; display: flex; align-items: center; gap: 0.75rem;
    font-size: 0.625rem; letter-spacing: 0.14em; color: var(--ui-dim);
    font-variant-numeric: tabular-nums;
  }
  .deck__scrub input {
    flex: 1; appearance: none; height: 2px;
    background: rgba(237, 232, 226, 0.25); border-radius: 1px;
    outline-offset: 6px; cursor: pointer;
  }
  .deck__scrub input::-webkit-slider-thumb {
    appearance: none; width: 12px; height: 12px; border-radius: 50%;
    background: rgba(237, 232, 226, 0.9); border: 0;
  }
  .deck__scrub input::-moz-range-thumb {
    width: 12px; height: 12px; border-radius: 50%;
    background: rgba(237, 232, 226, 0.9); border: 0;
  }
  .deck__controls { display: flex; gap: 0.5rem; }
  .deck__controls button {
    font: inherit; font-size: 0.6875rem; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--ui); background: rgba(237, 232, 226, 0.07);
    border: 1px solid rgba(237, 232, 226, 0.22); border-radius: 999px;
    padding: 0.5rem 1.15rem; cursor: pointer;
    transition: border-color 0.2s ease, background 0.2s ease;
  }
  .deck__controls button:hover { border-color: rgba(237, 232, 226, 0.55); }
  .deck__controls button:focus-visible { outline: 2px solid rgba(237, 232, 226, 0.8); outline-offset: 2px; }
  .deck__controls button[aria-pressed="true"] {
    background: rgba(237, 232, 226, 0.18); border-color: rgba(237, 232, 226, 0.55);
  }
</style>
</head>

    caret.setAttribute('height', bar.fs * 1.25);
    caret.setAttribute('rx', bar.fs / 16);
    g.appendChild(pill); g.appendChild(text); g.appendChild(caret);
    omniRoot.appendChild(g);
    bar.g = g; bar.pill = pill; bar.textEl = text; bar.caretEl = caret;
  });

  /* Renders one omnibar: flight progress k (1 = off-canvas, 0 = landed),
     typed character count n, caret visibility. The pill grows from its
     centre as the text types. */
  function setBar(bar, opacity, k, scale, blur, n, caretOn) {
    var fs = bar.fs;
    bar.textEl.textContent = bar.text.slice(0, n);
    var textW = n > 0 ? bar.textEl.getComputedTextLength() : 0;
    var padX = fs, gap = fs * 0.18;
    var pillW = Math.max(textW + (n > 0 ? gap + fs / 8 : 0) + 2 * padX, fs * 2.2);
    var pillH = fs * 2.55;
    bar.pill.setAttribute('x', -pillW / 2);
    bar.pill.setAttribute('y', -pillH / 2);
    bar.pill.setAttribute('width', pillW);
    bar.pill.setAttribute('height', pillH);
    bar.pill.setAttribute('rx', pillH / 2);
    bar.textEl.setAttribute('x', -pillW / 2 + padX);
    bar.textEl.setAttribute('y', fs * 0.36);
    bar.caretEl.setAttribute('x', -pillW / 2 + padX + textW + (n > 0 ? gap : 0));
    bar.caretEl.setAttribute('y', -fs * 0.625);
    bar.caretEl.setAttribute('opacity', caretOn ? 1 : 0);
    var x = bar.cx + bar.from[0] * k;
    var y = bar.cy + bar.from[1] * k;
    bar.g.setAttribute('opacity', opacity);
    bar.g.setAttribute('transform',
      'translate(' + x + ' ' + y + ') scale(' + scale + ') rotate(-0.25)');
    var f = 'drop-shadow(0 0 2px rgba(0,0,0,0.6)) drop-shadow(0 20px 48px rgba(0,0,0,0.2))';
    if (blur > 0.4) { f = 'blur(' + blur + 'px) ' + f; }
    bar.g.style.filter = f;
  }

  /* ---------------------------------------------------------------- *
   * Easing
   * ---------------------------------------------------------------- */

  function clamp01(t) { return Math.min(1, Math.max(0, t)); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function seg(t, a, b, ease) { return (ease || linear)(clamp01((t - a) / (b - a))); }
  function linear(t) { return t; }
  function easeInOut(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
  function easeOut(t) { return 1 - Math.pow(1 - t, 3); }

  /* ---------------------------------------------------------------- *
   * Timeline
   *   0    – 2600   sequence 01: sparkle arrival, mark forms, glow wakes
   *   2750 – 8000   sequence 03: omnibars fly in and type, one by one
   *   glow breathes from 2600 on a 2800ms cycle, forever
   *   after TOTAL, time wraps inside the last 2800ms window
   * ---------------------------------------------------------------- */

  var BREATH = 2800;
  var BAR_START = [2750, 4150, 5550];
  var FLY = 900;
  var TYPE_DELAY = 650;
  var TYPE_MS = 38;          /* per character */
  var BLINK = 1400;          /* caret blink cycle; 2 cycles per loop window */
  var TOTAL = 8000 + BREATH;
  var LOOP_HEAD = TOTAL - BREATH;

  function renderArrival(t) {
    var s = Math.pow(46, 1 - seg(t, 0.00, 1.45, easeInOut));
    var rot = lerp(0, -45, seg(t, 0.95, 1.45, easeInOut));
    starG.setAttribute('transform',
      'translate(1459 939) scale(' + s + ') rotate(' + rot + ')');
    var blur = 12 * (1 - seg(t, 0.0, 0.7, easeOut));
    starFill.style.filter = blur > 0.4 ? 'blur(' + blur + 'px)' : 'none';
    union.style.opacity = seg(t, 1.40, 1.80, easeInOut);
    starFill.style.opacity = 0.46 * (1 - seg(t, 1.55, 1.90, easeInOut));
  }

  function renderGlow(ms) {
    var t = ms / 1000;
    var amount = seg(t, 2.05, 2.70, easeInOut);
    var phase = Math.max(0, ms - 2600) / BREATH;
    var wave = 0.5 - 0.5 * Math.cos(phase * Math.PI * 2);
    var scale = 0.94 + 0.1 * wave;
    glowG.setAttribute('opacity', amount * (0.6 + 0.4 * wave));
    glowG.setAttribute('transform',
      'translate(' + (1459 * (1 - scale)) + ' ' + (939 * (1 - scale)) + ') scale(' + scale + ')');
  }

  function renderBars(ms) {
    for (var i = 0; i < BARS.length; i++) {
      var bar = BARS[i];
      var local = ms - BAR_START[i];
      if (local <= 0) { bar.g.setAttribute('opacity', 0); continue; }
      var fly = seg(local, 0, FLY, easeOut);
      var opacity = seg(local, 0, 350, easeOut);
      var k = 1 - fly;
      var scale = lerp(1.5, 1, fly);
      var blur = 16 * (1 - fly);
      var typed = Math.floor(Math.max(0, local - TYPE_DELAY) / TYPE_MS);
      var n = Math.min(bar.text.length, typed);
      var done = n >= bar.text.length;
      var caretOn = local > TYPE_DELAY - 250 && (!done || (ms % BLINK) < BLINK * 0.55);
      setBar(bar, opacity, k, scale, blur, n, caretOn);
    }
  }

  function renderAt(ms) {
    renderArrival(Math.min(ms, 2600) / 1000);
    renderGlow(ms);
    renderBars(ms);
  }

  /* ---------------------------------------------------------------- *
   * Player
   * ---------------------------------------------------------------- */

  var scrub = document.getElementById('scrub');
  var clock = document.getElementById('clock');
  var clockEnd = document.getElementById('clockEnd');
  var replayBtn = document.getElementById('replay');
  var slowBtn = document.getElementById('slow');

  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var slow = false;
  var raf = 0;
  var startStamp = 0;

  clockEnd.textContent = (TOTAL / 1000).toFixed(2) + 's';

  function show(ms) {
    if (ms > TOTAL) { ms = LOOP_HEAD + ((ms - LOOP_HEAD) % BREATH); }
    renderAt(ms);
    scrub.value = String(Math.round((ms / TOTAL) * 1000));
    clock.textContent = (ms / 1000).toFixed(2) + 's';
  }

  function frame(now) {
    show((now - startStamp) / (slow ? 3 : 1));
    raf = requestAnimationFrame(frame);   /* breathes and blinks forever */
  }

  function play() {
    cancelAnimationFrame(raf);
    if (reduced) { show(TOTAL - BREATH / 4); return; }
    raf = requestAnimationFrame(function (now) {
      startStamp = now;
      frame(now);
    });
  }

  scrub.addEventListener('input', function () {
    cancelAnimationFrame(raf);
    show((Number(scrub.value) / 1000) * TOTAL);
  });
  replayBtn.addEventListener('click', play);
  slowBtn.addEventListener('click', function () {
    slow = !slow;
    slowBtn.setAttribute('aria-pressed', String(slow));
    play();
  });
  document.getElementById('stage').addEventListener('click', play);

  /* Idle chrome */
  var chrome = document.querySelectorAll('.chrome');
  var idleTimer = 0;
  function wake() {
    chrome.forEach(function (el) { el.classList.remove('is-idle'); });
    clearTimeout(idleTimer);
    idleTimer = setTimeout(function () {
      chrome.forEach(function (el) { el.classList.add('is-idle'); });
    }, 2600);
  }
  ['pointermove', 'pointerdown', 'keydown', 'touchstart'].forEach(function (ev) {
    window.addEventListener(ev, wake, { passive: true });
  });
  wake();

  show(0);
  play();
})();
</script>
</body>
</html>
